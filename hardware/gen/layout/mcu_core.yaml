# Block 2: RP2350A core. References (D-012, Reviewer-A F12): RP2350 datasheet §6.3 Fig. 22 p.453 (core
# regulator as drawn: C_IN at VREG_VIN, L1 on VREG_LX, C_OUT at the L1 output, VREG_FB from C_OUT, all
# returns on VREG_PGND joined to GND at one point, p.454) plus the Fig. 21 p.452 external-1V1 jumpers
# JP5 (bridged, VREG_FB-DVDD) / JP6 (open, VREG_FB-GND) (P7-6); Hardware design with RP2350: crystal §4
# Fig. 10 p.13 (same circuit in the minimal design Fig. 15 p.20), per-pin decoupling, VREG_AVDD RC
# (R5/C18), QSPI flash wired straight to the QSPI pins, BOOTSEL via 1k on QSPI_SS, 27R USB series.
# The KiCad RP2350A symbol has VREG_PGND (47) on the bottom edge and VREG_VIN/LX/FB on the top edge, so
# the C_IN / C_OUT / PGND loop is drawn wired at pin 47 (3V3 and DVDD reach it by their power symbols)
# and L1 + the jumpers stay at the top pins.
