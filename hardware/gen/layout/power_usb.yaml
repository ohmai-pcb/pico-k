# Block 1: USB-C power entry. Reference: USB Type-C spec Rd = 5.1k on CC1/CC2 (sink); USBLC6-2SC6
# datasheet application (lines pass through I/O1/I/O2, VBUS pin to VBUS); D1 VBUS -> VSYS as the
# Pico 2 datasheet power chain (p.14-15). architecture.md §USB-C, §Power tree.
title: "1 power / USB-C (USBLC6-2SC6 Fig. 14)"
paper: A4
parts:
  J1: {lib: "Connector:USB_C_Receptacle_USB2.0_16P", value: USB-C, fp: "pico-k:USB_C_Receptacle_ShouHan_TYPE-C-16PIN-2MD-073", mpn: "TYPE-C 16PIN 2MD(073)", nets: {"A1": GND, "A12": GND, "B1": GND, "B12": GND, "S1": GND, "A4": VBUS, "A9": VBUS, "B4": VBUS, "B9": VBUS, "A5": CC1, "B5": CC2, "A6": USB_CONN_DP, "B6": USB_CONN_DP, "A7": USB_CONN_DM, "B7": USB_CONN_DM, "A8": NC, "B8": NC}}
  R10: {lib: "Device:R", value: "5.1k", mpn: "0402WGF5101TCE", fp: "Resistor_SMD:R_0402_1005Metric", nets: {"1": CC1, "2": GND}}
  R11: {lib: "Device:R", value: "5.1k", mpn: "0402WGF5101TCE", fp: "Resistor_SMD:R_0402_1005Metric", nets: {"1": CC2, "2": GND}}
  U4: {lib: "Power_Protection:USBLC6-2SC6", value: USBLC6-2SC6, fp: "Package_TO_SOT_SMD:SOT-23-6", mpn: USBLC6-2SC6, nets: {"1": USB_CONN_DP, "6": USB_CONN_DP, "3": USB_CONN_DM, "4": USB_CONN_DM, "2": GND, "5": VBUS}}
  D1: {lib: "Device:D_Schottky", value: MBR120VLSFT1G, mpn: MBR120VLSFT1G, fp: "Diode_SMD:D_SOD-123F", nets: {"1": VSYS, "2": VBUS}}
  C19: {lib: "Device:C", value: "10u", mpn: CL10A106MA8NRNC, fp: "Capacitor_SMD:C_0603_1608Metric", nets: {"1": VBUS, "2": GND}}
place:
