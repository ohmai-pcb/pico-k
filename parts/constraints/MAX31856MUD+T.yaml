layout_notes:
  - {text: "0.1 uF ceramic bypass capacitors close to the VDD pins and to GND", cite: {page: 27, where: "Noise Considerations"}}
  - {text: "100 nF differential capacitor across T+ and T-; in high-noise / RF environments add 10 nF from T+ to GND and from T- to GND (Fig. 8)", cite: {page: 27, where: "Noise Considerations"}}
  - {text: "Connect BIAS to T- (biases the thermocouple within the input common-mode range). Junction point per Fig. 8: BIAS joins the T- line on the thermocouple/connector side of the T- 100 ohm series resistor; the 10 nF and 100 nF caps are on the pin side", cite: {page: 27, where: "Thermocouple Temperature Sensing Guidelines; Fig. 8"}}
  - {text: "If faults beyond ±45 V are possible, add series resistance (example 2 kOhm) in T+, T- and BIAS; not planned for pico-k (D-006 P4-8)", cite: {page: 27, where: "Input Protection"}}
  - {text: "SPI: CPHA must be 1 (CPOL either); SDO is high impedance while CS is high (firmware note)", cite: {page: 15, where: "Serial Interface, Table 3 note"}}
  - {text: "Open-circuit detection mode (firmware): with 100 ohm + 100 nF input filter the source resistance is < 5 kOhm, so mode 01 applies", cite: {page: 14, where: "Table 4"}}
  - {text: "Series resistors raise offset (p.28 example: 1 ohm mismatch + 50 ohm cable); match the two 100 ohm input resistors as closely as possible; if the cable resistance is known, increase the T- resistor by it", cite: {page: 28, where: "Effect of Series Resistance"}}
  - {text: "Place the IC at the same temperature as the thermocouple connector (cold junction); keep it away from heat sources (regulator, D1)", cite: {page: 28, where: "MAX31856 Location"}}
open_questions:
  - "DRDY and FAULT are 'output' in the Pin Description (p.10) and the VOH/VOL spec (p.5) suggests push-pull, but Rev 0 does not say push-pull or open-drain (P5-9, Reviewer-A F12). RESOLVED D-009 (owner): no pull-up fitted; DNF 10 kOhm pull-up footprints to 3V3 at the DRDY and FAULT test pads (R23, R24); no wire-OR; confirm the drive type on rev-A (bring-up plan) and fit R23/R24 only if the outputs prove open-drain."
  - "AGND and DGND: datasheet gives no rule how to join them. pico-k plan: single ground plane, both pins to GND - confirm."
  - "Fig. 8 shows 100 ohm in series with T+ and T- (two resistors). pico-k R12/R13. p.27 also allows larger series R for overvoltage, at the cost of offset."
