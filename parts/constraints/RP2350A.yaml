layout_notes:
- text: Place and route the core regulator first and follow Fig. 22 (schematic) and Fig. 23 (Pico 2 layout) as closely as possible; RPi says other
    layouts are at your own risk (HDG p.6-7)
  cite:
    page: 452
    where: §6.3.8
- text: 'VREG_AVDD: RC filtered (33 ohm / 4.7 uF); C_FILT has its own low-impedance GND path to the QFN pad, not shared with CIN/COUT vias'
  cite:
    page: 455
    where: §6.3.8.1
- text: 'Keep the two switching current loops (Fig. 23 red/green arrows) small and isolated; connect them to main GND at one point with 2 adjacent
    vias (loops p.454; 2 adjacent vias p.455)'
  cite:
    page: 454
    where: §6.3.8.1
- text: 'C29 (D-008, 2nd C_IN): C16 stays in the Fig. 23 C_IN position; place C29 directly next to C16 on the same VREG_VIN / VREG_PGND
    copper and share its GND vias, without enlarging the switching loop or moving C_OUT or L_X'
  cite:
    page: 454
    where: Fig. 23 (layout), §6.3.8.1 p.455
- text: 'L1 fallback (D-009, P5-13): keep a DNF footprint for an external 1.1 V DVDD regulator (Fig. 21 p.452: internal regulator unused,
    VREG_FB to GND, no inductor, VREG_VIN and VREG_AVDD still powered) with DNF links so either route can be built; part chosen in phase 6'
  cite:
    page: 452
    where: §6.3.7 Fig. 21 external 1.1 V supply
- text: C_IN, L_X and C_OUT on the same PCB side as RP2350 (none on the opposite side)
  cite:
    page: 454
    where: §6.3.8.1
- text: Cut away copper under the inductor and near the VREG_LX trace on the top layer; on 4+ layer boards also cut layer 2 under L_X / VREG_LX
    (Fig. 24) - pico-k is 4-layer (P4-11)
  cite:
    page: 455
    where: §6.3.8.1, Fig. 24
- text: Feed VREG_FB from the output of C_OUT; do not route it directly under L_X
  cite:
    page: 455
    where: §6.3.8.1
- text: 'Inductor polarity: the marked end must face as in Fig. 23; a wrong-way inductor''s field couples into C_OUT and upsets the regulator
    (EMI and regulation), especially at high load/transients'
  cite:
    page: 456
    where: §6.3.8.3, Fig. 25
- text: Datasheet text says C_OUT must be placed between VREG_VIN and VREG_PGND; that is the C_IN position (see open questions). Place C_IN between
    VREG_VIN (49) and VREG_PGND (47) as close as possible
  cite:
    page: 455
    where: §6.3.8.1
- text: '100 nF per power pin close to the pin; pins 53/54 may share one capacitor (RPi minimal design: 10 x 100 nF on RP2350A, C8 and C10-C18)'
  cite:
    page: 8
    where: §2.2.1, Fig. 6/7
    doc: hardware-design-with-rp2350.pdf (build 2026-08-20)
- text: 'USB_DP/DM: 27 ohm series resistors close to the chip; ~90 ohm differential, solid GND under the whole length (0.8 mm / 0.15 mm gap on
    a 1 mm 2-layer board in the RPi example; recompute for the pico-k 4-layer stack)'
  cite:
    page: 15
    where: §5.1 USB
    doc: hardware-design-with-rp2350.pdf (build 2026-08-20)
- text: 'QSPI: wire directly to the flash with short traces; place R1/R6 close to the flash'
  cite:
    page: 10
    where: §3.1
    doc: hardware-design-with-rp2350.pdf (build 2026-08-20)
- text: 'Crystal: keep XIN/XOUT traces short (stray ~3 pF assumed in the load calculation)'
  cite:
    page: 13
    where: §4
    doc: hardware-design-with-rp2350.pdf (build 2026-08-20)
open_questions:
- Table 1432 (p.1338) lists IOVDD QFN-60 pins as 11, 20, 30, 38, 45, 54, but the same table gives 54 = QSPI_IOVDD and Fig. 2 (p.15) shows pin
  1 = IOVDD. This file follows Fig. 2 and both RPi schematics (pin 1 IOVDD, pin 54 QSPI_IOVDD). Accepted as resolved by the owner, D-007 (P5-8).
- p.455 says 'C_OUT ... must be placed between VREG_VIN and VREG_PGND'. Electrically that is C_IN. Treated as a datasheet typo; confirm against
  Fig. 22/23. Accepted as resolved by the owner, D-007 (P5-8).
- Abs max for VREG_VIN, VREG_AVDD, VREG_LX, USB_OTP_VDD, ADC_AVDD and the XOSC/USB pins is not in Table 1433 (p.1338-1339). Only recommended ranges
  (Table 1441) are recorded. Accepted, D-007 (P5-8).
- 'C_IN >= 4.7 uF and C_OUT 4.7 uF ±20 % (p.455): nominal or effective after DC bias? D-007 (P5-6) moved the caps to 0603 16 V X5R CL10A475KO8NNNC
  (LCSC C19666). Samsung DC-bias curve (datasheets/CL10A475KO8NNNC.pdf), ESTIMATE read from the plot: about -4 % at 1.1 V (4.5 uF, C_OUT and pin-23
  cap within ±20 %) and about -32 % at 3.3 V (3.2 uF for C_IN, below 4.7 uF if the minimum is effective). RESOLVED D-008 (P5-10, owner): a second
  4.7 uF C29 in parallel with C16 on VREG_VIN; C_IN = 2 x 4.7 uF ≈ 6.4-6.6 uF typ at 3.3 V, ≈ 5.1 uF worst case (-10 % tolerance, -12 % at 85 °C from
  the TCC plot), >= 4.7 uF (ESTIMATE). Independent read (Reviewer-A review F25): about -30 %, C_IN ~3.3 uF; RPi''s own 0402 6.3 V part
  derates more, so the RPi value is evidently nominal.'
- 'VREG_AVDD filter resistor: HDG p.7 says 33 ohm (R3); Pico 2 W schematic uses 27R (R17). pico-k follows HDG (33 ohm, R5 in bom.csv). Accepted, D-007 (P5-8).'
- 'ADC_AVDD filter capacitor: RESOLVED D-009 (P5-11): 4.7 uF. Pico 2 datasheet p.14 text says "201 ohm into 2.2 uF", but both RPi schematics
  use 4u7, checked on the drawings 2026-10-15: Pico 2 datasheet Fig. 11 p.20 C13 4u7 M1005 6.3 V X5R 20 % from the R9 (1R) / ADC_AVDD node
  (pin 44) to GND, R7 200R from 3V3; Pico 2 W schematic (pico-2-w-schematic.pdf p.1) C13 4u7 M1005 6.3 V X5R 20 % on the same R9 / ADC_AVDD
  node. pico-k C27 = 4.7 uF 0603 16 V CL10A475KO8NNNC (≈ 3.25 uF at 3.3 V, curve ESTIMATE); D-025 (2026-10-17): C27 and the
  VREG_AVDD cap C18 now 0402 25 V TDK105CBJ475MV-F (≈ 2.7 uF at 3.3 V, Taiyo Yuden curve ESTIMATE; owner accepted).'
- 'Second 4.7 uF at DVDD pin 23 (recommended p.455): added as C28, D-007 (P5-4).'
- XIN/XOUT directions are taken from the XOSC description (§8.2 p.554-555), not from a direction column (Table 1429 says 'Analogue (XOSC)'). Accepted, D-007 (P5-8).
