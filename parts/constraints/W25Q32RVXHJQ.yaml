open_questions:
  - "No decoupling value in the Winbond datasheet. 100 nF follows the RPi minimal design (C2, HDG Fig. 15 p.20) and Pico 2 W; confirm."
  - "CS pull-up: Winbond §4.1 p.6 says /CS must track VCC at power-up and 'a pull-up resistor can be used'; GD25Q32E Table 2 note 1 (p.6) says CS# must never float after power-on. RP2350 QSPI_SS has an internal pull-up at reset, but RPi (HDG p.10) says another flash may need the 10 kOhm. RESOLVED (D-006, bom.csv U2/R6): R6 DNF with the W25Q32RV, fitted (10 kOhm) when the GD25Q32E is used."
  - "QE / quad mode (firmware + bring-up item, Reviewer-A F36): W25Q32RV ordering option JQ ships with QE = 1 (§7.1.10 p.15), so IO2/IO3 are data pins out of the box. GD25Q32E ships with the status register at 00H except DRV0 (§8.2 Initial Delivery State, PDF p.37), i.e. QE = 0 (QE bit default 0, p.13): WP#/HOLD# are active until QE is set (p.9). The RP2350 boot ROM scans flash with 03h serial reads only (RP2350 §5.2 Processor-controlled boot sequence, printed p.369), which work with QE = 0 if WP#/HOLD# are not held low; quad XIP is set up later by the program (SDK flash/boot2 code), which must set QE on the GD part. With the GD alternate: confirm the firmware sets QE (or program QE once at production) and check QSPI_SD2/SD3 idle high during serial boot. Not verified on hardware."
  - "Center pad: tie to GND or leave floating? Both are allowed (p.77). Pico 2 W shows pin 9 PAD on U3; the net is not readable in the text extract. Decide in the schematic; pin 9 is entered as passive (no nc flag) so either choice passes the checks."
