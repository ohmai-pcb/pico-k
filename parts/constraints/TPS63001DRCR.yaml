open_questions:
  - "Input/output capacitor values are nominal in Table 1 (10 uF in, 2 x 10 uF out, 6.3 V 0603 X7R) and 'recommended nominal output capacitance 15 uF' (p.12). pico-k uses 10 uF 25 V X5R 0603 CL10A106MA8NRNC (LCSC C96446, D-007 P5-6). Samsung DC-bias curve (datasheets/CL10A106MA8NRNC.pdf), ESTIMATE read from the plot: about -33 % at 3.3 V (6.7 uF each, 13.4 uF for C21+C22, below the 15 uF nominal) and about -52 % at 5 V (4.8 uF for C20, near the 4.7 uF minimum before the -20 % tolerance). Independent read (Reviewer-A review F28): -38 % / -56 %, i.e. C21+C22 ~12.4 uF and C20 ~4.4 uF, below 'at least 4.7 uF' even at nominal; still no worse than TI's Table 1 0603 6.3 V X7R. RESOLVED D-008 (P5-10, owner): one more 10 uF on each side. Cin (amended D-009, P5-14): ONE 10 uF 50 V X5R 1206 CL31A106KBHNNNE (C20, LCSC C13585) instead of C20 + C30: curve read (datasheets/CL31A106KBHNNNE.pdf) -22.5 % at 5.0 V = 7.75 uF, -24.8 % at 5.25 V = 7.5 uF; worst case (-10 % tolerance, about -10 % at 85 °C from the TCC plot) ≈ 6.1 uF >= 4.7 uF. Cout = C21 + C22 + C31: ≈ 18.6-20.1 uF typ at 3.3 V >= 15 uF, ≈ 14.9-16.1 uF at -20 % tolerance, ≈ 14.2-15.3 uF at -20 % and 85 °C (CL10A106MA8NRNC TCC about -5 %; informational: 15 uF is a recommended nominal value); TI states no upper limit (p.12). ESTIMATE from both curve reads. USB VBUS inrush (USB 2.0 §7.2.4.1 p.177: 10 uF ∥ 44 ohm incl. 'capacitive effects visible through the regulator'): the TPS63001 soft start begins at a 400 mA average current limit (§7.4.1 p.9), so the 3V3 output capacitance is visible on VBUS; the exceedance is accepted for rev-A as a documented deviation (D-010), VBUS droop is measured at bring-up."
  - "PS/SYNC: pico-k drives it from RP2350 GPIO23 as on Pico 2 (Pico 2 datasheet p.15) with R16 100 kOhm pull-down (Pico 2 W R8 on PS). TI only says 0 = power save; a defined level while RP2350 is in reset needs the pull-down - confirm R16's role in the schematic."
  - "Datasheet inconsistency: RθJA 46.8 degC/W in Thermal Information (p.4) vs 48.7 degC/W in §10.3 (p.16). Use 48.7 (worse) for estimates; dissipation is small at pico-k currents."
  - "Inductor: TI Table 2 (p.11) lists recommended 2.2 uH parts; pico-k uses SWPA3015S2R2MT (not in Table 2), sized in phase 4 from Eq. 3-4 (p.11-12)."
